    <script>
        window.addEventListener("DOMContentLoaded", function () {
            const volumeSlider = document.getElementById("volumeSlider");
            const audio = document.getElementById("songs");
            const playButton = document.getElementById("playButton");
            const previousButton = document.getElementById("previousButton");
            const nextButton = document.getElementById("nextButton");
            const musicProgress = document.getElementById("musicProgress");
            const currentTime = document.getElementById("currentTime");
            const duration = document.getElementById("duration");
            const songTitle = document.getElementById("songTitle");
            const songArtist = document.getElementById("songArtist");
            const playlist = [
                { src: "media/twilight zone.mp3", title: "Twilight Zone", artist: "Kira" },
                { src: "media/lovers.mp3", title: "Lovers", artist: "Kira" }
            ];
            let currentSongIndex = 0;

            function formatTime(time) {
                if (!Number.isFinite(time)) return "0:00";
                const minutes = Math.floor(time / 60);
                const seconds = Math.floor(time % 60).toString().padStart(2, "0");
                return `${minutes}:${seconds}`;
            }

            function updatePlayButton() {
                playButton.textContent = audio.paused ? "▶" : "Ⅱ";
                playButton.setAttribute("aria-label", audio.paused ? "Play song" : "Pause song");
            }

            function loadSong(index, shouldPlay = false) {
                currentSongIndex = (index + playlist.length) % playlist.length;
                const song = playlist[currentSongIndex];
                audio.src = song.src;
                songTitle.textContent = song.title;
                songArtist.textContent = song.artist;
                currentTime.textContent = "0:00";
                duration.textContent = "0:00";
                musicProgress.value = 0;
                audio.load();
                if (shouldPlay) audio.play();
            }

            if (volumeSlider && audio) {
                audio.volume = Number(volumeSlider.value);
                volumeSlider.addEventListener("input", function () {
                    audio.volume = Number(this.value);
                });
            }

            if (playButton && musicProgress && audio) {
                playButton.addEventListener("click", function () {
                    if (audio.paused) {
                        audio.play();
                    } else {
                        audio.pause();
                    }
                });

                previousButton.addEventListener("click", function () {
                    loadSong(currentSongIndex - 1, true);
                });

                nextButton.addEventListener("click", function () {
                    loadSong(currentSongIndex + 1, true);
                });

                audio.addEventListener("loadedmetadata", function () {
                    duration.textContent = formatTime(audio.duration);
                });

                audio.addEventListener("timeupdate", function () {
                    musicProgress.value = audio.duration ? (audio.currentTime / audio.duration) * 100 : 0;
                    currentTime.textContent = formatTime(audio.currentTime);
                });

                audio.addEventListener("play", updatePlayButton);
                audio.addEventListener("pause", updatePlayButton);
                audio.addEventListener("error", function () {
                    playButton.textContent = "▶";
                    playButton.setAttribute("aria-label", "Song unavailable");
                });
                musicProgress.addEventListener("input", function () {
                    if (audio.duration) audio.currentTime = (Number(this.value) / 100) * audio.duration;
                });
                document.body.addEventListener("click", function (event) {
                    if (!event.target.closest(".music-player") && audio.paused) audio.play();
                });
                updatePlayButton();
            }
        });
    </script>
